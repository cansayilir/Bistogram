name: AI Sepeti Günlük Güncelleme

on:
  schedule:
    - cron: "0 6 * * *"  # her gün 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python scripts/update_ai_basket.py

      - name: Değişiklik varsa commit'le ve push et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai_basket_state.json
          git diff --quiet --cached || git commit -m "Otomatik günlük AI Sepeti güncellemesi"
          git push
