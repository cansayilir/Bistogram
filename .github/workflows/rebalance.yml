name: Aylık Sepet Güncelleme

on:
  schedule:
    - cron: "0 6 1 * *"  # her ayın 1'i, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python scripts/rebalance.py

      - name: Değişiklik varsa commit'le ve push et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/basket_state.json
          git diff --quiet --cached || git commit -m "Otomatik aylık sepet güncellemesi"
          git push
